<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
body{font:12px Arial,sans-serif;color:#222;background:#088;overflow: hidden;}
.window,.title-bar{font:11px "MS Sans Serif",Tahoma,Arial,sans-serif;-webkit-font-smoothing:none}
.window{width:300px;background:#c0c0c0;padding:3px;box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #dfdfdf,inset -2px -2px #808080,inset 2px 2px #fff}
.window-body{margin:8px}
.title-bar{background:linear-gradient(90deg,#000080,#1084d0);padding:3px 2px 3px 3px}
.title-bar-text{font-weight:700;color:#fff;margin-right:24px}
.status-bar{margin:0 1px;display:flex;gap:1px}
.status-bar-field{flex-grow:1;padding:2px 3px;margin:0;box-shadow:inset -1px -1px #dfdfdf,inset 1px 1px #808080}
.center{display:flex;justify-content:center;align-items:center;height:100vh}
</style>
</head>
<body>
<div class="center">
<div class="window">
<div class="title-bar"><div class="title-bar-text">Web Properties</div></div>
<div class="window-body">
<p style="font-size: 13px;">This is some of the information the websites can know about your browser:</p>
<p id="r"><b>Resolution:</b> loading...</p>
<p id="n"><b>Browser:</b> loading...</p>
<p id="o"><b>Online:</b> loading...</p>
<p id="p"><b>Platform:</b> loading...</p>
<p id="c"><b>Mouse Position:</b> 0, 0</p>
<p id="s"><b>Mouse scroll:</b> waiting the user to scroll...</p>
<p id="z"><b>Time zone:</b> loading...</p>
</div>
<div class="status-bar">
<p class="status-bar-field" id="f">Fps: </p>
<p class="status-bar-field" id="l">Lang</p>
<p class="status-bar-field" id="t">in the website</p>
</div>
</div>
</div>
<script>
const $=i=>document.getElementById(i),
set=(i,v)=>$(i).innerHTML="<b>"+v[0]+":</b> "+v[1];
let frames=0,last=performance.now(),secs=0;
(function f(now){
frames++;
const e=now-last;
if(e>=100){$("f").innerHTML="<b>Fps: </b>"+(frames*1000/e).toFixed(2);frames=0;last=now}
requestAnimationFrame(f)
})(last);
addEventListener("mousemove",e=>set("c",["Mouse Position",e.pageX+", "+e.pageY]));
addEventListener("wheel",e=>{if(e.deltaY)set("s",["Mouse scroll",e.deltaY>0?"down":"up"])});
function tick(){
const u=navigator.userAgentData;
set("r",["Resolution",innerWidth+" x "+innerHeight]);
set("n",["Browser",JSON.stringify(u?u.brands:navigator.userAgent)]);
set("o",["Online",navigator.onLine?"yes!":"no :("]);
set("p",["Platform",navigator.platform||"sorry i don't have that info"]);
set("z",["Time zone",Intl.DateTimeFormat().resolvedOptions().timeZone]);
$("l").innerHTML=navigator.language;
secs++;
$("t").innerHTML=(secs<60?secs+" sec":secs<3600?(secs/60|0)+" min":(secs/3600|0)+" h")+" in the website"
}
tick();
setInterval(tick,1000)
</script>
</body>
</html>
